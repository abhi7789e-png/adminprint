<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Srinibas Print Hub - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --approve-grad: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --reject-grad: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 10%, #e0e7ff 0%, #fce7f3 40%, #f5f3ff 80%, #ffffff 100%);
      min-height: 100vh;
      color: var(--text-main);
      padding: 30px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-status {
      background: rgba(99, 102, 241, 0.1);
      color: #6366f1;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 25px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.05), 0 10px 25px -5px rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Side Panel QR */
    .side-panel {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .qr-box {
      padding: 15px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.2);
      margin: 15px 0;
      border: 2px solid #f1f5f9;
    }

    /* Specs Badges */
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 15px 0;
    }

    .spec-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
    }

    .spec-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    .spec-val { font-size: 14px; font-weight: 800; color: #1e293b; margin-top: 2px; }

    /* Action Buttons */
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .action-btn {
      flex: 1;
      padding: 15px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .action-btn:hover { transform: translateY(-2px); }
    .btn-approve { background: var(--approve-grad); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); }
    .btn-reject { background: var(--reject-grad); box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3); }

    /* Preview Screen */
    iframe, img.preview {
      width: 100%;
      height: 380px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      margin-top: 15px;
      background: #ffffff;
    }

    .waiting-box {
      height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 10px;
    }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <div class="brand-title">
      ✨ Hello, Srinibas! Let's do the work
    </div>
    <div class="badge-status">🟢 System Ready</div>
  </header>

  <div class="dashboard-grid">
    <!-- Main Print Job Panel -->
    <div class="glass-card">
      <h2 style="font-size: 18px; font-weight: 800; color: #334155; margin-bottom: 10px;">Current Print Request</h2>
      
      <div id="job-container">
        <div class="waiting-box">
          <div style="font-size: 36px;">⏳</div>
          <p style="font-weight: 700;">Waiting for customer documents...</p>
        </div>
      </div>
    </div>

    <!-- Side Scanner / QR Code Panel -->
    <div class="glass-card side-panel">
      <h3 style="font-size: 16px; font-weight: 800;">Customer Scan QR</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Works on all 4G / 5G Mobile Data</p>
      
      <div class="qr-box">
        <!-- Replace YOUR_GITHUB_USERNAME with your real GitHub repo username -->
        <img id="qr-code" width="180" height="180" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://abhi7789e-png.github.io/print-station/" alt="Scan QR" />
      </div>

      <span style="font-size: 12px; font-weight: 700; color: #8b5cf6;">Scan to Send Files</span>
    </div>
  </div>

  <iframe id="print-frame" style="display:none;"></iframe>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBOE1m_P-cnB-D79QKh0Hkp4VT-bG0BcuY",
  authDomain: "auto-print-8e959.firebaseapp.com",
  databaseURL: "https://auto-print-8e959-default-rtdb.firebaseio.com",
  projectId: "auto-print-8e959",
  appId: "1:718790139534:web:0285bace5f866e10d633df"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let initialLoad = true;
    let currentFile = null;
    let currentJobKey = null;

    // Realtime listener for print jobs
    db.ref('print_jobs').limitToLast(1).on('child_added', snapshot => {
      if (initialLoad) return;

      const data = snapshot.val();
      currentJobKey = snapshot.key; // Unique Firebase document ID
      currentFile = data;

      const preview = data.fileType && data.fileType.includes("image")
        ? `<img src="${data.fileData}" class="preview"/>`
        : `<iframe src="${data.fileData}"></iframe>`;

      // Audio notification tone
      const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
      audio.play().catch(() => {});

      document.getElementById("job-container").innerHTML = `
        <div>
          <h3 style="color:#0f172a; font-size:17px; font-weight:800;">📄 ${data.fileName}</h3>
          
          <div class="specs-grid">
            <div class="spec-card">
              <div class="spec-label">Paper Type</div>
              <div class="spec-val">${data.paperType || 'A4 Normal'}</div>
            </div>
            <div class="spec-card">
              <div class="spec-label">Orientation</div>
              <div class="spec-val">${data.orientation || 'Portrait'}</div>
            </div>
            <div class="spec-card">
              <div class="spec-label">Color Mode</div>
              <div class="spec-val" style="color:#6366f1;">${data.colorMode || 'Black & White'}</div>
            </div>
          </div>

          ${preview}

          <div class="btn-group">
            <button class="action-btn btn-approve" onclick="approveAndPrint()">🖨️ Approve & Print</button>
            <button class="action-btn btn-reject" onclick="rejectJob()">✖ Reject Job</button>
          </div>
        </div>
      `;
    });

    setTimeout(() => { initialLoad = false; }, 1500);

    // Instant deletion helper
    function deleteJobImmediately(jobKey) {
      if (jobKey) {
        db.ref(`print_jobs/${jobKey}`).remove().catch(err => console.error("Deletion error:", err));
      }
    }

    function approveAndPrint() {
      if (!currentFile) return;

      const base64Data = currentFile.fileData;
      const isImage = currentFile.fileType && currentFile.fileType.includes("image");
      const keyToDelete = currentJobKey;

      if (isImage) {
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
          <html>
            <body style="margin:0; display:flex; justify-content:center; align-items:center;">
              <img src="${base64Data}" style="max-width:100%; max-height:100vh;" onload="window.print(); window.close();" />
            </body>
          </html>
        `);
        printWindow.document.close();
      } else {
        fetch(base64Data)
          .then(res => res.blob())
          .then(blob => {
            const blobUrl = URL.createObjectURL(blob);
            const frame = document.getElementById("print-frame");
            frame.src = blobUrl;
            frame.onload = () => {
              frame.contentWindow.focus();
              frame.contentWindow.print();
            };
          });
      }

      // 1. Instantly delete from database
      deleteJobImmediately(keyToDelete);

      // 2. Clear UI display
      document.getElementById("job-container").innerHTML = `
        <div class="waiting-box" style="color: #10b981;">
          <div style="font-size: 36px;">✅</div>
          <p style="font-weight: 700;">Job approved, printed & removed from database.</p>
        </div>
      `;
      currentFile = null;
      currentJobKey = null;
    }

    function rejectJob() {
      // 1. Instantly delete from database
      deleteJobImmediately(currentJobKey);

      // 2. Clear UI display
      currentFile = null;
      currentJobKey = null;
      document.getElementById("job-container").innerHTML = `
        <div class="waiting-box" style="color: #f43f5e;">
          <div style="font-size: 36px;">🗑️</div>
          <p style="font-weight: 700;">Job rejected & deleted from database.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
